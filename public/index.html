<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة التعدين الاستراتيجي | جمهورية رواندا</title>

    <!-- الخطوط الاحترافية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة الخرائط Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-surface: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.96);
            --panel-border: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            
            --brand-blue: #2563eb;
            --brand-blue-hover: #1d4ed8;
            --brand-green: #16a34a;
            --brand-green-hover: #15803d;
            --brand-red: #dc2626;

            --mineral-tin: #0070f3;       
            --mineral-tungsten: #ff4500;  
            --mineral-coltan: #e11d48;    
            --mineral-gold: #d97706;      
            --mineral-lithium: #10b981;   
            --mineral-other: #8b5cf6;     

            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition-fast: 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', 'Inter', sans-serif; }
        body { background-color: var(--bg-surface); color: var(--text-primary); height: 100vh; width: 100vw; overflow: hidden; display: flex; }
        #map { position: absolute; inset: 0; z-index: 1; background: #e2e8f0; }

        .dashboard-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 390px;
            max-height: calc(100vh - 40px);
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        body.lang-en .dashboard-panel { right: auto; left: 20px; }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        .title-area h1 { font-size: 1.15rem; font-weight: 900; color: var(--text-primary); }
        .title-area p { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

        .btn-lang {
            background: #e2e8f0;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition-fast);
        }
        .btn-lang:hover { background: var(--brand-blue); color: #ffffff; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            padding: 12px;
        }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 800; color: var(--text-primary); }

        .filter-group { display: flex; flex-direction: column; gap: 12px; }
        .field-group { display: flex; flex-direction: column; gap: 4px; }
        .field-label { font-size: 0.75rem; font-weight: 800; color: var(--text-primary); }
        
        .select-input, .text-input {
            width: 100%;
            padding: 10px 12px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition-fast);
        }
        .select-input:focus, .text-input:focus {
            border-color: var(--brand-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .range-container { display: flex; flex-direction: column; gap: 6px; }
        .range-slider { width: 100%; accent-color: var(--brand-blue); cursor: pointer; }

        .legend-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            padding: 12px;
        }
        .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.75rem; font-weight: 700; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .badge-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.25); }

        .btn-export {
            background: var(--brand-green);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-fast);
        }
        .btn-export:hover { background: var(--brand-green-hover); }

        .leaflet-popup-content-wrapper {
            background: #ffffff !important;
            border-radius: var(--radius-lg) !important;
            box-shadow: var(--shadow-lg) !important;
            padding: 0 !important;
            overflow: hidden;
        }
        .leaflet-popup-content { margin: 0 !important; width: 280px !important; }
        
        .popup-card { padding: 16px; }
        .popup-header { border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px; }
        .popup-title { font-size: 1rem; font-weight: 900; color: var(--text-primary); }
        .popup-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 6px; }
        .popup-row span.label { color: var(--text-muted); font-weight: 600; }
        .popup-row span.val { font-weight: 800; color: var(--text-primary); }
        
        .btn-gmaps {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--brand-red);
            color: #ffffff;
            text-decoration: none;
            padding: 10px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 800;
            margin-top: 12px;
            transition: var(--transition-fast);
        }
        .btn-gmaps:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <div id="map"></div>

    <aside class="dashboard-panel">
        <header class="header-bar">
            <div class="title-area">
                <h1 id="ui-title">منظومة التعدين الاستراتيجي</h1>
                <p id="ui-subtitle">جمهورية رواندا - خادم C++</p>
            </div>
            <button class="btn-lang" id="btnLang" onclick="toggleLanguage()">English</button>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label" id="ui-stat-mines">المناجم النشطة</div>
                <div class="stat-value" id="statMinesCount">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label" id="ui-stat-prod">إجمالي الإنتاج (طن)</div>
                <div class="stat-value" id="statTotalProd">--</div>
            </div>
        </section>

        <section class="filter-group">
            <div class="field-group">
                <label class="field-label" id="ui-lbl-mineral">تصفية حسب المعدن</label>
                <!-- القيم هنا تطابق الأسماء المخزنة في قاعدة بيانات Supabase -->
                <select class="select-input" id="filterMineral" onchange="fetchDataFromCppBackend()">
                    <option value="all">جميع المعادن</option>
                    <option value="Cassiterite">الكاسيتريت (قصدير - Tin)</option>
                    <option value="Wolframite">الولفراميت (تنجستن - Tungsten)</option>
                    <option value="Coltan">الكولتان (Coltan)</option>
                    <option value="Gold">الذهب (Gold)</option>
                    <option value="Lithium">الليثيوم (Lithium)</option>
                </select>
            </div>

            <div class="field-group">
                <label class="field-label" id="ui-lbl-company">تصفية حسب الشركة المشغلة</label>
                <select class="select-input" id="filterCompany" onchange="fetchDataFromCppBackend()">
                    <option value="all">جميع الشركات</option>
                </select>
            </div>

            <div class="field-group">
                <label class="field-label" id="ui-lbl-province">تصفية حسب المقاطعة</label>
                <select class="select-input" id="filterProvince" onchange="fetchDataFromCppBackend()">
                    <option value="all">جميع المقاطعات</option>
                </select>
            </div>

            <div class="range-container">
                <label class="field-label" id="ui-lbl-minprod">أدنى كمية إنتاج: <span id="minProdVal">0</span> طن</label>
                <input type="range" class="range-slider" id="filterMinProd" min="0" max="2000" value="0" step="50" oninput="updateRangeVal(this.value); fetchDataFromCppBackend();">
            </div>

            <div class="field-group">
                <input type="text" class="text-input" id="filterSearch" placeholder="بحث باسم المنجم..." oninput="applyLocalSearch()">
            </div>
        </section>

        <section class="legend-box">
            <div class="legend-grid">
                <div class="legend-item"><span class="badge-dot" style="background:var(--mineral-tin)"></span><span id="lg-tin">قصدير</span></div>
                <div class="legend-item"><span class="badge-dot" style="background:var(--mineral-tungsten)"></span><span id="lg-tungsten">تنجستن</span></div>
                <div class="legend-item"><span class="badge-dot" style="background:var(--mineral-coltan)"></span><span id="lg-coltan">كولتان</span></div>
                <div class="legend-item"><span class="badge-dot" style="background:var(--mineral-gold)"></span><span id="lg-gold">ذهب</span></div>
                <div class="legend-item"><span class="badge-dot" style="background:var(--mineral-lithium)"></span><span id="lg-lithium">ليثيوم</span></div>
                <div class="legend-item"><span class="badge-dot" style="background:var(--mineral-other)"></span><span id="lg-other">أخرى</span></div>
            </div>
        </section>

        <button class="btn-export" onclick="exportToCSV()" id="ui-btn-export">📥 تنزيل البيانات (CSV)</button>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const streetMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CARTO', maxZoom: 19
        });

        const satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        const satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}');
        const satelliteGroup = L.layerGroup([satelliteMap, satLabels]);

        const map = L.map('map', {
            center: [-1.9403, 29.8739], 
            zoom: 9,
            layers: [streetMap]
        });

        const baseMaps = {
            "🗺️ خريطة شوارع فاتحة": streetMap,
            "🛰️ أقمار اصطناعية": satelliteGroup
        };
        L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);

        let currentMinesData = [];
        let displayedMarkers = [];
        let isDropdownsPopulated = false;
        let currentLang = 'ar';

        const i18n = {
            ar: {
                title: "منظومة التعدين الاستراتيجي", subtitle: "جمهورية رواندا - خادم C++",
                statMines: "المناجم النشطة", statProd: "إجمالي الإنتاج (طن)",
                lblMineral: "تصفية حسب المعدن", lblCompany: "تصفية حسب الشركة المشغلة",
                lblProvince: "تصفية حسب المقاطعة", lblMinProd: "أدنى كمية إنتاج: ",
                searchPlaceholder: "بحث باسم المنجم أو المشغل...", btnExport: "📥 تنزيل البيانات (CSV)",
                gmapsBtn: "📍 فتح في خرائط جوجل", operator: "الشركة المشغلة:",
                mineral: "المعدن الأساسي:", prod: "الإنتاج الشهري:", province: "المقاطعة / الإقليم:",
                lgTin: "قصدير", lgTungsten: "تنجستن", lgColtan: "كولتان", lgGold: "ذهب", lgLithium: "ليثيوم", lgOther: "أخرى"
            },
            en: {
                title: "Strategic Mining System", subtitle: "Republic of Rwanda - C++ Engine",
                statMines: "Active Mines", statProd: "Total Production (Tons)",
                lblMineral: "Filter by Mineral", lblCompany: "Filter by Operator Company",
                lblProvince: "Filter by Province", lblMinProd: "Min Production: ",
                searchPlaceholder: "Search mine or operator...", btnExport: "Export Data (CSV)",
                gmapsBtn: "📍 Open in Google Maps", operator: "Operator:",
                mineral: "Primary Mineral:", prod: "Monthly Production:", province: "Province / District:",
                lgTin: "Tin", lgTungsten: "Tungsten", lgColtan: "Coltan", lgGold: "Gold", lgLithium: "Lithium", lgOther: "Other"
            }
        };

        function getMineralColor(mineral) {
            if (!mineral) return 'var(--mineral-other)';
            const m = mineral.toLowerCase();
            if (m.includes('cassiterite') || m.includes('tin')) return '#0070f3';
            if (m.includes('wolframite') || m.includes('tungsten')) return '#ff4500';
            if (m.includes('coltan')) return '#e11d48';
            if (m.includes('gold')) return '#d97706';
            if (m.includes('lithium')) return '#10b981';
            return '#8b5cf6';
        }

        function updateRangeVal(val) {
            document.getElementById('minProdVal').innerText = val;
        }

        async function fetchDataFromCppBackend() {
            try {
                const mineral = document.getElementById('filterMineral').value;
                const company = document.getElementById('filterCompany').value;
                const province = document.getElementById('filterProvince').value;
                const minProd = document.getElementById('filterMinProd').value;

                // استخدام رابط نسبي مباشر لمنع أخطاء الدومين المتقاطع CORS
                const url = `/api/mines?mineral=${encodeURIComponent(mineral)}&company=${encodeURIComponent(company)}&province=${encodeURIComponent(province)}&min_prod=${minProd}`;
                
                const response = await fetch(url);
                const mines = await response.json();

                currentMinesData = mines || [];

                if (!isDropdownsPopulated && currentMinesData.length > 0) {
                    populateDropdowns(currentMinesData);
                    isDropdownsPopulated = true;
                }

                renderMinesOnMap(currentMinesData);
            } catch (err) {
                console.error("خطأ في الاتصال بخادم C++ Backend:", err);
            }
        }

        function populateDropdowns(data) {
            const companySelect = document.getElementById('filterCompany');
            const provinceSelect = document.getElementById('filterProvince');

            const companies = new Set();
            const provinces = new Set();

            data.forEach(m => {
                if (m.operator) companies.add(m.operator);
                if (m.province) provinces.add(m.province);
            });

            companies.forEach(c => companySelect.innerHTML += `<option value="${c}">${c}</option>`);
            provinces.forEach(p => provinceSelect.innerHTML += `<option value="${p}">${p}</option>`);
        }

        function renderMinesOnMap(mines) {
            displayedMarkers.forEach(m => map.removeLayer(m));
            displayedMarkers = [];

            let totalProd = 0;
            let activeCount = 0;

            mines.forEach(mine => {
                if (!mine.latitude || !mine.longitude) return;

                activeCount++;
                totalProd += mine.monthly_production_tons || 0;

                const color = getMineralColor(mine.primary_mineral);

                const marker = L.circleMarker([mine.latitude, mine.longitude], {
                    radius: 9,
                    fillColor: color,
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                });

                const t = i18n[currentLang];
                const googleMapsUrl = `https://www.google.com/maps?q=${mine.latitude},${mine.longitude}`;

                const popupHTML = `
                    <div class="popup-card">
                        <div class="popup-header">
                            <div class="popup-title">${mine.mine_name || 'منجم بدون اسم'}</div>
                        </div>
                        <div class="popup-row"><span class="label">${t.operator}</span><span class="val">${mine.operator || '-'}</span></div>
                        <div class="popup-row"><span class="label">${t.mineral}</span><span class="val" style="color:${color}">${mine.primary_mineral || '-'}</span></div>
                        <div class="popup-row"><span class="label">${t.prod}</span><span class="val">${mine.monthly_production_tons || 0} طن</span></div>
                        <div class="popup-row"><span class="label">${t.province}</span><span class="val">${mine.province || '-'}</span></div>
                        <a href="${googleMapsUrl}" target="_blank" class="btn-gmaps">${t.gmapsBtn}</a>
                    </div>
                `;

                marker.bindPopup(popupHTML);
                marker.addTo(map);
                displayedMarkers.push(marker);
            });

            document.getElementById('statMinesCount').innerText = activeCount;
            document.getElementById('statTotalProd').innerText = Math.round(totalProd).toLocaleString();
        }

        function applyLocalSearch() {
            const query = document.getElementById('filterSearch').value.toLowerCase();
            displayedMarkers.forEach(m => {
                const popupContent = m.getPopup().getContent().toLowerCase();
                if (popupContent.includes(query)) {
                    map.addLayer(m);
                } else {
                    map.removeLayer(m);
                }
            });
        }

        function exportToCSV() {
            if (!currentMinesData.length) return alert("لا توجد بيانات متاحة لتنزيلها");

            let csv = "\uFEFFاسم المنجم,المشغل,المعدن,الإنتاج الشهري (طن),المقاطعة,خط العرض,خط الطول\n";
            currentMinesData.forEach(m => {
                csv += `"${m.mine_name || ''}","${m.operator || ''}","${m.primary_mineral || ''}",${m.monthly_production_tons || 0},"${m.province || ''}",${m.latitude || ''},${m.longitude || ''}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `rwanda_mines_report_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.body.classList.toggle('lang-en', currentLang === 'en');
            document.getElementById('btnLang').innerText = currentLang === 'ar' ? 'English' : 'العربية';

            const t = i18n[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-subtitle').innerText = t.subtitle;
            document.getElementById('ui-stat-mines').innerText = t.statMines;
            document.getElementById('ui-stat-prod').innerText = t.statProd;
            document.getElementById('ui-lbl-mineral').innerText = t.lblMineral;
            document.getElementById('ui-lbl-company').innerText = t.lblCompany;
            document.getElementById('ui-lbl-province').innerText = t.lblProvince;
            document.getElementById('ui-btn-export').innerText = t.btnExport;
            document.getElementById('filterSearch').placeholder = t.searchPlaceholder;

            document.getElementById('lg-tin').innerText = t.lgTin;
            document.getElementById('lg-tungsten').innerText = t.lgTungsten;
            document.getElementById('lg-coltan').innerText = t.lgColtan;
            document.getElementById('lg-gold').innerText = t.lgGold;
            document.getElementById('lg-lithium').innerText = t.lgLithium;
            document.getElementById('lg-other').innerText = t.lgOther;

            fetchDataFromCppBackend();
        }

        // بدء التشغيل التلقائي
        fetchDataFromCppBackend();
    </script>
</body>
</html>
